name: Publish to NPM

on:
  release: # Run when release is created
    types: [created]
  workflow_dispatch: # allow re-running the publish without recreating the release

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # the Node.js versions to build on
        node-version: [22.x, 24.x]
        # verify against both supported Homebridge majors before publishing
        homebridge-version: ['1.11.4', '2.3.1']

    name: node ${{ matrix.node-version }} / homebridge ${{ matrix.homebridge-version }}

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Install homebridge ${{ matrix.homebridge-version }}
        run: npm install --no-save homebridge@${{ matrix.homebridge-version }}

      - name: Lint the project
        run: npm run lint

      - name: Run the unit tests
        run: npm test

      - name: Build the project
        run: npm run build
        env:
          CI: true

  publish-npm:
    # publish only if we are on our own repo and either a version tag was released or the workflow was run manually
    if: github.repository == 'kovalev-sergey/homebridge-sony-audio' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')))

    needs: build # only run if build succeeds

    runs-on: ubuntu-latest

    # npm trusted publishing (OIDC): no long lived NPM_TOKEN, provenance is attached automatically
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # use the minimum required version
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm # trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@latest
      - run: npm ci
      - name: Resolve the npm dist-tag
        id: disttag
        # A prerelease version (2.1.0-beta.1) must never land on the `latest` dist-tag,
        # otherwise every user would be upgraded to it.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG=beta
          else
            TAG=latest
          fi
          echo "Publishing $VERSION with dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm publish --tag ${{ steps.disttag.outputs.tag }} # authenticated through OIDC, no NODE_AUTH_TOKEN
